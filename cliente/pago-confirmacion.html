<!-- cliente/pago-confirmacion.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Confirmado - Cafetería ESII</title>
  
  <!-- Scripts necesarios -->
  <link rel="stylesheet" href="/settings-modal.css">
  <script src="/settings.js"></script>
  <script src="/sounds.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #77A159;
      --primary-dark: #5a8244;
      --success: #4CAF50;
      --text: #333;
      --text-light: #666;
      --bg: #f5f6fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirmacion-container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.5s ease-out;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .check-icon {
      width: 120px;
      height: 120px;
      margin: 20px auto;
      animation: scaleIn 0.5s ease-out 0.2s both;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .success-message {
      font-size: 32px;
      font-weight: 800;
      color: var(--success);
      margin: 20px 0;
    }

    .success-subtitle {
      color: var(--text-light);
      font-size: 16px;
      margin-bottom: 30px;
    }

    .order-details {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 15px;
      margin: 25px 0;
      text-align: left;
    }

    .order-details p {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 15px;
    }

    .order-details p:last-child {
      border-bottom: none;
    }

    .order-details strong {
      color: var(--text);
      font-weight: 600;
    }

    .order-details span {
      color: var(--text-light);
      font-weight: 500;
    }

    .btn {
      padding: 16px 40px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(119, 161, 89, 0.4);
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 2px solid #e0e0e0;
      margin-right: 10px;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
      border-color: var(--text-light);
    }

    .button-group {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .confirmacion-container {
        padding: 30px 20px;
      }

      .success-message {
        font-size: 26px;
      }

      .check-icon {
        width: 100px;
        height: 100px;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .btn-secondary {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>

  <div class="confirmacion-container">
    <img src="/assets/confirmacion_icono.png" class="check-icon" alt="Confirmado">
    
    <div class="success-message" data-i18n="payment_success">¡Pago realizado con éxito!</div>
    
    <p class="success-subtitle" data-i18n="order_processed">
      Tu pedido ha sido procesado correctamente
    </p>
    
    <div class="order-details" id="order-info">
      <p>
        <strong data-i18n="order_number">Número de pedido:</strong>
        <span id="order-number">-</span>
      </p>
      <p>
        <strong data-i18n="order_date">Fecha:</strong>
        <span id="order-date">-</span>
      </p>
      <p>
        <strong data-i18n="order_payment_method">Método de pago:</strong>
        <span id="order-method">-</span>
      </p>
      <p>
        <strong data-i18n="order_total">Total:</strong>
        <span id="order-total" style="color: #77A159; font-weight: 700;">0.00 €</span>
      </p>
    </div>
    
    <div class="button-group">
      <button class="btn btn-secondary" onclick="window.location.href='/'">
        🏠 <span data-i18n="btn_back_home">Volver al inicio</span>
      </button>
      <button class="btn btn-primary" onclick="window.location.href='/menu-productos.html'">
        🍽️ <span data-i18n="btn_new_order">Hacer otro pedido</span>
      </button>
    </div>
  </div>

  <script>
    function generarNumeroPedido() {
      return 'ORD-' + Date.now().toString().slice(-8);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Aplicar configuración de idioma
      const settings = AppSettings.load();
      AppSettings.apply(settings);

      const orderNumber = generarNumeroPedido();
      
      const now = new Date();
      const dateStr = now.toLocaleDateString(settings.idioma === 'en' ? 'en-US' : settings.idioma === 'fr' ? 'fr-FR' : 'es-ES', { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      const lastTotal = localStorage.getItem('last_order_total') || '0.00';
      const lastMethod = localStorage.getItem('last_order_method') || 'Efectivo';
      const orderItems = JSON.parse(localStorage.getItem('order_items') || '[]');

      document.getElementById('order-number').textContent = orderNumber;
      document.getElementById('order-date').textContent = dateStr;
      
      // Traducir método de pago
      let translatedMethod = lastMethod;
      if (settings.idioma === 'en') {
        const methodTranslations = {
          'Efectivo': 'Cash',
          'Tarjeta': 'Card',
          'Bizum': 'Bizum',
          'PayPal': 'PayPal'
        };
        translatedMethod = methodTranslations[lastMethod] || lastMethod;
      } else if (settings.idioma === 'fr') {
        const methodTranslations = {
          'Efectivo': 'Espèces',
          'Tarjeta': 'Carte',
          'Bizum': 'Bizum',
          'PayPal': 'PayPal'
        };
        translatedMethod = methodTranslations[lastMethod] || lastMethod;
      }
      
      document.getElementById('order-method').textContent = translatedMethod;
      document.getElementById('order-total').textContent = lastTotal + ' €';

      // Guardar información completa del pedido
      const orderData = {
        orderId: orderNumber,
        date: dateStr,
        total: lastTotal,
        method: lastMethod,
        items: orderItems,
        timestamp: Date.now()
      };
      
      localStorage.setItem('current_order', JSON.stringify(orderData));
      localStorage.setItem('order_' + orderNumber, JSON.stringify(orderData));

      // Limpiar datos temporales del pedido anterior
      localStorage.removeItem('last_order_total');
      localStorage.removeItem('last_order_method');
      localStorage.removeItem('order_items');
    });
  </script>

</body>
</html>
