<div id="fmLogin">
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0" data-i18n="login_title">Iniciar sesión</h5>
        </div>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="email" data-i18n="email_label">Email:</label>
                    <input type="email" class="form-control" placeholder="Introduce tu email" id="email" data-i18n="email_placeholder" required>
                </div>
                <div class="form-group">
                    <label for="pwd" data-i18n="password_label">Contraseña:</label>
                    <input type="password" class="form-control" placeholder="Introduce tu contraseña" id="pwd" data-i18n="password_placeholder" required>
                </div>
                <button type="submit" id="btnLogin" class="btn btn-primary" data-i18n="btn_login">Iniciar sesión</button>
                <button type="button" id="btnRegistro" class="btn btn-secondary ml-2" data-i18n="btn_register_link">Registrarse</button>
                <button type="button" id="btnRegistroNick" class="btn btn-secondary ml-2" data-i18n="btn_register_nick">Agregar usuario por Nick</button>
                <hr class="my-4">
                
                <div id="btnGS" class="text-center"></div>
            </form>
        </div>
    </div>
</div>
