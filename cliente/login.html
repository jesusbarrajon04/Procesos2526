<div id="fmLogin">
    <form>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" placeholder="Introduce email" id="email">
        </div>
        <div class="form-group">
            <label for="pwd">Password:</label>
            <input type="password" class="form-control" placeholder="Introduce password" id="pwd">
        </div>
        <button type="submit" id="btnLogin" class="btn btn-primary">Iniciar sesión</button>
        <button type="button" id="btnRegistro" class="btn btn-secondary ml-2">Registrarse</button>
        
    </form>
    <div class="text-center">
        <p class="mb-2">O inicia sesión con:</p></div>
        <p><div id="btnGS"></div></p>
</div>
