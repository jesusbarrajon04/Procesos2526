<div id="fmRegistro">
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0" data-i18n="register_title">Registrar nueva cuenta</h5>
        </div>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="nombre" data-i18n="name_label">Nombre:</label>
                    <input type="text" class="form-control" placeholder="Tu nombre" id="nombre" data-i18n="name_placeholder">
                </div>
                <div class="form-group">
                    <label for="apellidos" data-i18n="lastname_label">Apellidos:</label>
                    <input type="text" class="form-control" placeholder="Tus apellidos" id="apellidos" data-i18n="lastname_placeholder">
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="email_label">Email: <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" placeholder="tu@email.com" id="email" data-i18n="email_placeholder_register" required>
                    <small class="form-text text-muted" data-i18n="email_confirmation_text">Recibirás un correo de confirmación</small>
                </div>
                <div class="form-group">
                    <label for="pwd" data-i18n="password_label">Contraseña: <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" placeholder="Mínimo 6 caracteres" id="pwd" data-i18n="password_placeholder_register" required>
                </div>
                <button type="submit" id="btnRegistro" class="btn btn-primary" data-i18n="btn_register">Registrar cuenta</button>
                <p class="mt-3 text-muted"><small data-i18n="required_fields_text">* Campos obligatorios</small></p>
            </form>
        </div>
    </div>
</div>
