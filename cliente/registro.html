<div id="fmRegistro">
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Registrar nueva cuenta</h5>
            <form>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" class="form-control" placeholder="Tu nombre" id="nombre">
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" class="form-control" placeholder="Tus apellidos" id="apellidos">
                </div>
                <div class="form-group">
                    <label for="email">Email: <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" placeholder="tu@email.com" id="email" required>
                    <small class="form-text text-muted">Recibirás un correo de confirmación</small>
                </div>
                <div class="form-group">
                    <label for="pwd">Contraseña: <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" placeholder="Mínimo 6 caracteres" id="pwd" required>
                </div>
                <button type="submit" id="btnRegistro" class="btn btn-primary">Registrar cuenta</button>
                <p class="mt-3 text-muted"><small>* Campos obligatorios</small></p>
            </form>
        </div>
    </div>
</div>
